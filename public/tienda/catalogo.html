<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo - Vivero Solís</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .categorias-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: white;
            border: 1px solid var(--verde-acento);
            color: var(--verde-acento);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--verde-acento);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Vivero Solís</a>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html" style="color: var(--verde-suave);">Catálogo</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="../clientes/login.html" class="btn-login">Mi Cuenta</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" style="height: 40vh;">
        <div>
            <h1>Nuestro Catálogo</h1>
            <p>Explora nuestra variedad completa de plantas y accesorios</p>
        </div>
    </section>

    <div id="categorias-nav" class="categorias-container">
        </div>

    <section class="catalogo-section">
        <div id="lista-productos" class="catalogo-grid">
            <p style="text-align: center; width: 100%;">Cargando todo el catálogo...</p>
        </div>
    </section>

    <footer>
        <p>Vivero Solís &copy; 2025</p>
    </footer>

    <script src="js/carrito.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
